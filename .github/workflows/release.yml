name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "${RELEASE_TAG#v}" <<'PY'
          import json
          import subprocess
          import sys

          release_version = sys.argv[1]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          package_versions = {
              package["name"]: package["version"] for package in metadata["packages"]
          }

          for package_name in ("agentenv", "aenv"):
              package_version = package_versions[package_name]
              if package_version != release_version:
                  raise SystemExit(
                      f"{package_name} version {package_version} does not match "
                      f"release tag v{release_version}"
                  )
          PY

  build-darwin-cli:
    name: Build Darwin CLI (${{ matrix.asset_name }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: x86_64-apple-darwin
            asset_name: aenv-darwin-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: aenv-darwin-aarch64
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (macOS)
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build aenv
        run: cargo build --release --locked -p aenv --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/aenv
          cp "$BIN" dist/${{ matrix.asset_name }}
          strip dist/${{ matrix.asset_name }} || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-linux:
    name: Build Linux release (${{ matrix.arch }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            rust_target: x86_64-unknown-linux-musl
            modes: kvm pvm
          - os: ubuntu-24.04-arm
            arch: aarch64
            rust_target: aarch64-unknown-linux-musl
            modes: kvm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libprotobuf-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-musl-gcc-${{ matrix.rust_target }}

      - name: Build static Linux binaries
        env:
          MUSL_TOOLCHAIN_RELEASE: "20240917"
        run: |
          set -euo pipefail

          work_dir="$(mktemp -d "$RUNNER_TEMP/agentenv-static-release.XXXXXXXX")"
          trap 'rm -rf "$work_dir"' EXIT

          toolchain_archive_name="${{ matrix.arch }}-linux-musl-native.tgz"
          toolchain_archive="$work_dir/$toolchain_archive_name"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://download.wireguard.com/qemu-test/toolchains/$MUSL_TOOLCHAIN_RELEASE/$toolchain_archive_name" \
            -o "$toolchain_archive"

          tar -xzf "$toolchain_archive" -C "$work_dir"
          toolchain_dir="$work_dir/${{ matrix.arch }}-linux-musl-native"
          toolchain_bin="$toolchain_dir/bin"

          for compiler in gcc g++ ar ranlib; do
            test -x "$toolchain_bin/$compiler" || {
              echo "ERROR: musl toolchain is missing bin/$compiler"
              exit 1
            }
          done

          target_env_key="${{ matrix.rust_target }}"
          target_env_key="${target_env_key//-/_}"
          target_key="${{ matrix.rust_target }}"
          target_key="${target_key^^}"
          target_key="${target_key//-/_}"
          export "CC_${target_env_key}=$toolchain_bin/gcc"
          export "CXX_${target_env_key}=$toolchain_bin/g++"
          export "AR_${target_env_key}=$toolchain_bin/ar"
          export "RANLIB_${target_env_key}=$toolchain_bin/ranlib"
          export "CARGO_TARGET_${target_key}_LINKER=$toolchain_bin/gcc"
          export "BINDGEN_EXTRA_CLANG_ARGS_${target_env_key}=--sysroot=$toolchain_dir"

          "$toolchain_bin/gcc" --version | head -n 1
          "$toolchain_bin/g++" --version | head -n 1

          cargo build --release --locked --target "${{ matrix.rust_target }}" \
            -p aenv --bin aenv \
            -p uvm-ublk-daemon --bin uvm-ublk-daemon \
            -p agentenv --bin server \
            --features vendored-openssl

          target_dir="target/${{ matrix.rust_target }}/release"
          for binary in \
            "$target_dir/aenv" \
            "$target_dir/server" \
            "$target_dir/uvm-ublk-daemon"
          do
            test -x "$binary"
            file "$binary"
            if readelf -l "$binary" | grep -q INTERP; then
              echo "ERROR: $binary contains an ELF interpreter"
              exit 1
            fi
            if readelf -d "$binary" 2>&1 | grep -q NEEDED; then
              echo "ERROR: $binary contains dynamic dependencies"
              readelf -d "$binary"
              exit 1
            fi
          done

          mkdir -p dist
          cp "$target_dir/aenv" "dist/aenv-linux-${{ matrix.arch }}"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          TARGET_DIR="target/${{ matrix.rust_target }}/release"

          for MODE in ${{ matrix.modes }}; do
            BUNDLE="dist/bundle-$MODE"
            mkdir -p "$BUNDLE/ublk"
            cp "$TARGET_DIR/server" "$BUNDLE/server"
            strip "$BUNDLE/server"
            cp "$TARGET_DIR/uvm-ublk-daemon" "$BUNDLE/ublk/uvm-ublk-daemon"
            strip "$BUNDLE/ublk/uvm-ublk-daemon"
            cp config/default.toml "$BUNDLE/default.toml"

            sed -i \
              "s/^virtualization_mode = .*/virtualization_mode = \"$MODE\"/" \
              "$BUNDLE/default.toml"
            grep -qx "virtualization_mode = \"$MODE\"" "$BUNDLE/default.toml" || {
              echo "ERROR: failed to configure virtualization_mode=$MODE"
              exit 1
            }

            STAGE_HOME="$PWD/dist/tmp-aenv-$MODE"
            STAGE_DEPS="$STAGE_HOME/deps"
            mkdir -p "$STAGE_HOME"
            AENV_VIRTUALIZATION_MODE="$MODE" \
              AENV_HOME_PATH="$STAGE_HOME" \
              "$BUNDLE/server" --setup-only || {
                echo "ERROR: $MODE --setup-only failed; check network and dependency downloads"
                exit 1
              }

            test -d "$STAGE_DEPS" || {
              echo "ERROR: deps dir missing at $STAGE_DEPS after $MODE --setup-only"
              exit 1
            }
            test -f "$STAGE_DEPS/overlaybd/etc/overlaybd/overlaybd.json" || {
              echo "ERROR: missing staged overlaybd default config for $MODE"
              exit 1
            }
            cp -a "$STAGE_DEPS" "$BUNDLE/deps"
            mkdir -p "$BUNDLE/etc/overlaybd"
            cp "$STAGE_DEPS/overlaybd/etc/overlaybd/overlaybd.json" "$BUNDLE/etc/overlaybd/overlaybd.json"
            rm -rf "$STAGE_HOME"
            ARCHIVE="dist/aenv-server-linux-${{ matrix.arch }}.tar.gz"
            if [[ "$MODE" == "pvm" ]]; then
              ARCHIVE="dist/aenv-server-linux-${{ matrix.arch }}-pvm.tar.gz"
            fi
            tar -czf "$ARCHIVE" -C "$BUNDLE" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: server-bundles-${{ matrix.arch }}
          path: |
            dist/aenv-linux-${{ matrix.arch }}
            dist/aenv-server-linux-${{ matrix.arch }}*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-darwin-cli, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4.8.0
        with:
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Prepend documentation links
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          {
            printf '📖 Documentation for this release: '
            printf 'https://kvcache-ai.github.io/AgentENV/%s/\n' "$RELEASE_TAG"
            printf '\n---\n\n'
            cat CHANGES.md
          } > CHANGES.md.tmp
          mv CHANGES.md.tmp CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          files: |
            dist/aenv-linux-x86_64
            dist/aenv-linux-aarch64
            dist/aenv-darwin-x86_64
            dist/aenv-darwin-aarch64
            dist/aenv-server-linux-x86_64-pvm.tar.gz
            dist/aenv-server-linux-x86_64.tar.gz
            dist/aenv-server-linux-aarch64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker-publish-kvm-images:
    name: Build KVM Docker image (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            AENV_VIRTUALIZATION_MODE=kvm
          tags: |
            ghcr.io/${{ env.OWNER }}/aenv-server:${{ github.ref_name }}-${{ matrix.arch }}

  docker-publish-kvm-manifest:
    name: Publish multi-architecture KVM Docker image
    needs: docker-publish-kvm-images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    timeout-minutes: 30
    steps:
      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER}/aenv-server"
          version="${GITHUB_REF_NAME}"

          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"

      - name: Inspect published image
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${OWNER}/aenv-server:${GITHUB_REF_NAME}"

  docker-publish-pvm:
    name: Build and push PVM Docker image (amd64)
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PVM image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=agentenv-runtime
          build-args: |
            AENV_VIRTUALIZATION_MODE=pvm
          tags: |
            ghcr.io/${{ env.OWNER }}/aenv-server:${{ github.ref_name }}-pvm
            ghcr.io/${{ env.OWNER }}/aenv-server:latest-pvm
