name: Linux release build probe

on:
  push:
    branches:
      - feat/static-linux-release

jobs:
  build-cli:
    name: Build CLI (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: ''
            features: --features vendored-openssl
            asset_name: aenv-linux-x86_64
          - os: ubuntu-22.04-arm
            target: ''
            features: --features vendored-openssl
            asset_name: aenv-linux-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            features: ''
            asset_name: aenv-darwin-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            features: ''
            asset_name: aenv-darwin-aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libprotobuf-dev protobuf-compiler

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build aenv
        env:
          OPENSSL_STATIC: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo build --release --locked -p aenv ${{ matrix.features }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Audit Linux CLI dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary=target/release/aenv
          ldd_output="$(ldd "$binary")"
          printf '%s\n' "$ldd_output"
          ! grep -q 'not found' <<<"$ldd_output"
          ! grep -Eq 'lib(ssl|crypto)\.so' <<<"$ldd_output"

          while read -r dependency; do
            dependency="${dependency##*/}"
            case "$dependency" in
              linux-vdso.so.* | ld-linux-*.so.* | libc.so.* | libdl.so.* | \
              libgcc_s.so.* | libm.so.* | libpthread.so.* | librt.so.* | \
              libstdc++.so.* | libutil.so.*) ;;
              *) echo "ERROR: non-baseline dependency: $dependency"; exit 1 ;;
            esac
          done < <(awk 'NF && $1 != "statically" { print $1 }' <<<"$ldd_output")

      - name: Stage artifact
        run: |
          mkdir -p dist
          BIN=${{ matrix.target && format('target/{0}/release/aenv', matrix.target) || 'target/release/aenv' }}
          cp "$BIN" dist/${{ matrix.asset_name }}
          strip dist/${{ matrix.asset_name }} || true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-server:
    name: Build server (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            modes: kvm pvm
          - os: ubuntu-22.04-arm
            arch: aarch64
            modes: kvm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libprotobuf-dev protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build server binaries
        env:
          OPENSSL_STATIC: "1"
        run: |
          cargo build --release --locked \
            -p agentenv --bin server \
            -p uvm-ublk-daemon --bin uvm-ublk-daemon \
            --features vendored-openssl

      - name: Audit Linux server dependencies
        run: |
          set -euo pipefail
          for binary in target/release/server target/release/uvm-ublk-daemon; do
            ldd_output="$(ldd "$binary")"
            printf '%s\n' "$ldd_output"
            ! grep -q 'not found' <<<"$ldd_output"
            ! grep -Eq 'lib(ssl|crypto)\.so' <<<"$ldd_output"

            while read -r dependency; do
              dependency="${dependency##*/}"
              case "$dependency" in
                linux-vdso.so.* | ld-linux-*.so.* | libc.so.* | libdl.so.* | \
                libgcc_s.so.* | libm.so.* | libpthread.so.* | librt.so.* | \
                libstdc++.so.* | libutil.so.*) ;;
                *) echo "ERROR: $binary has non-baseline dependency: $dependency"; exit 1 ;;
              esac
            done < <(awk 'NF && $1 != "statically" { print $1 }' <<<"$ldd_output")
          done

      - name: Stage artifacts
        run: |
          set -euo pipefail

          for MODE in ${{ matrix.modes }}; do
            BUNDLE="dist/bundle-$MODE"
            mkdir -p "$BUNDLE/ublk"
            cp target/release/server "$BUNDLE/server"
            strip "$BUNDLE/server"
            cp target/release/uvm-ublk-daemon "$BUNDLE/ublk/uvm-ublk-daemon"
            strip "$BUNDLE/ublk/uvm-ublk-daemon"
            cp config/default.toml "$BUNDLE/default.toml"

            sed -i \
              "s/^virtualization_mode = .*/virtualization_mode = \"$MODE\"/" \
              "$BUNDLE/default.toml"
            grep -qx "virtualization_mode = \"$MODE\"" "$BUNDLE/default.toml" || {
              echo "ERROR: failed to configure virtualization_mode=$MODE"
              exit 1
            }

            STAGE_HOME="$PWD/dist/tmp-aenv-$MODE"
            STAGE_DEPS="$STAGE_HOME/deps"
            mkdir -p "$STAGE_HOME"
            AENV_VIRTUALIZATION_MODE="$MODE" \
              AENV_HOME_PATH="$STAGE_HOME" \
              "$BUNDLE/server" --setup-only || {
                echo "ERROR: $MODE --setup-only failed; check network and dependency downloads"
                exit 1
              }

            test -d "$STAGE_DEPS" || {
              echo "ERROR: deps dir missing at $STAGE_DEPS after $MODE --setup-only"
              exit 1
            }
            test -f "$STAGE_DEPS/overlaybd/etc/overlaybd/overlaybd.json" || {
              echo "ERROR: missing staged overlaybd default config for $MODE"
              exit 1
            }

            for tool in "$STAGE_DEPS"/overlaybd/bin/*; do
              if file "$tool" | grep -q 'ELF'; then
                file "$tool"
                if readelf -l "$tool" | grep -q INTERP || \
                   readelf -d "$tool" 2>&1 | grep -q NEEDED; then
                  echo "ERROR: OverlayBD tool is dynamically linked: $tool"
                  exit 1
                fi
              fi
            done

            cp -a "$STAGE_DEPS" "$BUNDLE/deps"
            mkdir -p "$BUNDLE/etc/overlaybd"
            cp "$STAGE_DEPS/overlaybd/etc/overlaybd/overlaybd.json" \
              "$BUNDLE/etc/overlaybd/overlaybd.json"
            rm -rf "$STAGE_HOME"
            ARCHIVE="dist/aenv-server-linux-${{ matrix.arch }}.tar.gz"
            if [[ "$MODE" == "pvm" ]]; then
              ARCHIVE="dist/aenv-server-linux-${{ matrix.arch }}-pvm.tar.gz"
            fi
            tar -czf "$ARCHIVE" -C "$BUNDLE" .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: server-bundles-${{ matrix.arch }}
          path: dist/aenv-server-linux-${{ matrix.arch }}*.tar.gz
          if-no-files-found: error

  release:
    name: Create probe GitHub Release
    needs: [build-cli, build-server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Create prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: static-linux-probe-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Static Linux probe ${{ github.run_number }}-${{ github.run_attempt }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/aenv-linux-x86_64
            dist/aenv-linux-aarch64
            dist/aenv-darwin-x86_64
            dist/aenv-darwin-aarch64
            dist/aenv-server-linux-x86_64-pvm.tar.gz
            dist/aenv-server-linux-x86_64.tar.gz
            dist/aenv-server-linux-aarch64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  build-docker:
    name: Build Docker image (${{ matrix.mode }}-${{ matrix.arch }})
    needs: [build-cli, build-server]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
            mode: kvm
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
            mode: kvm
          - os: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
            mode: pvm
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.agentenv
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            AENV_VIRTUALIZATION_MODE=${{ matrix.mode }}
          tags: |
            aenv-server:probe-${{ matrix.mode }}-${{ matrix.arch }}
